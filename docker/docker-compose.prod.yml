name: forge-api-prod

services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: forge-api
    restart: always
    env_file: ../.env
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: forge-postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-forge_db}
      POSTGRES_USER: ${DB_USER:-forge_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-forge_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
